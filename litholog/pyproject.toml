[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litholog"
version = "0.1.0"
description = "Open-source borehole strip logs, cross-sections, fence diagrams and aquifer models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib>=3.5", "openpyxl", "scipy", "pyshp", "pyproj", "scikit-image", "plotly", "kaleido", "tifffile", "imagecodecs", "pillow"]
keywords = ["borehole", "lithology", "hydrogeology", "geology", "strip log", "well log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
studio = ["PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.11", "qtawesome>=1.3"]
dev = ["pytest", "streamlit>=1.50"]

[project.scripts]
litholog = "litholog.cli:main"

[project.gui-scripts]
litholog-studio = "litholog.studio:main"

[tool.setuptools]
packages = ["litholog", "litholog.studio"]

[tool.setuptools.package-data]
litholog = ["data/*.xlsx", "fonts/*.ttf", "fonts/*.txt"]
