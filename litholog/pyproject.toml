[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litholog"
version = "0.1.0"
description = "Open-source borehole strip logs, cross-sections, fence diagrams and aquifer models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib>=3.5", "openpyxl"]
keywords = ["borehole", "lithology", "hydrogeology", "geology", "strip log", "well log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
litholog = "litholog.cli:main"

[tool.setuptools]
packages = ["litholog"]
